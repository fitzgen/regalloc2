[workspace]
members = ["regalloc2-tool"]
# `regicide/` is its own workspace root, checked out here as a git worktree.
exclude = ["regicide"]

[package]
name = "regalloc2"
version = "0.15.2"
authors = [
    "Chris Fallin <chris@cfallin.org>",
    "Mozilla SpiderMonkey Developers",
]
edition = "2018"
license = "Apache-2.0 WITH LLVM-exception"
description = "Backtracking register allocator inspired from IonMonkey"
repository = "https://github.com/bytecodealliance/regalloc2"

[dependencies]
log = { version = "0.4.8", default-features = false }
smallvec = { version = "1.6.1", features = ["union"] }
rustc-hash = { version = "2.0.0", default-features = false }
hashbrown = { version = "0.17", default-features = false, features = [] }

# Optional serde support, enabled by feature below.
serde = { version = "1.0.136", features = [
    "derive",
    "alloc",
], default-features = false, optional = true }

# Only needed by the `regicide-dump` feature, to encode a captured allocator
# input in postcard's binary format.
postcard = { version = "1.1.3", optional = true, default-features = false, features = ["use-std"] }

# The below are only needed for fuzzing.
arbitrary = { version = "1.4.2", optional = true }
arbtest = { version = "0.3.2", optional = true }
bumpalo = { version = "3.16.0", features = ["allocator-api2"] }
allocator-api2 = { version = "0.2.18", default-features = false, features = ["alloc"] }

# The `regicide` register allocator, reachable through `Algorithm::Regicide`.
regicide = { path = "regicide", optional = true, default-features = false, features = [
    "hashbrown",
    "entity-repr-8",
    "entity-repr-16",
] }

# When testing regalloc2 by itself, enable debug assertions and overflow checks.
[profile.release]
debug = true
debug-assertions = true
overflow-checks = true

[features]
default = ["std"]

# Currently does nothing, but historically enabled some `std` features such as
# the `Error` trait.
std = []

# Enables generation of DefAlloc edits for the checker.
checker = []

# Enables detailed logging which can be somewhat expensive.
trace-log = ["regicide?/trace-log"]

# Enables the `regicide` register allocator as `Algorithm::Regicide`.
regicide = ["dep:regicide"]

# Enables capturing the input to `Algorithm::Regicide`, for replaying it outside
# the program that produced it. Does nothing unless `REGICIDE_DUMP` names a
# directory to write to; see the `regicide::dump` module.
# `deserialize` so that a capture can be read back by the build that wrote it,
# which is what the `regicide_dump*` tests check.
regicide-dump = [
    "regicide",
    "regicide?/serialize",
    "regicide?/deserialize",
    "dep:postcard",
    "std",
]

# Exposes the internal API for fuzzing.
#
# `regicide/checker` localizes a fuzz failure: running regicide's own checker
# over the same allocation says whether a disagreement is regicide's or this
# crate's translation of it.
fuzzing = [
    "arbitrary",
    "arbtest",
    "checker",
    "trace-log",
    "regicide",
    "regicide?/checker",
]

# Enables serde for exposed types.
enable-serde = ["serde"]
